name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # github.head_ref is only set when the workflow was triggered by a pull_request and it
  # contains the value of the source branch of the PR.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      infra: ${{ steps.filter.outputs.tf }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tf:
              - 'tf/**'
            web:
              - '**'
              - '!tf/**'
              - '!README.md'

  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: changes
    # Runs if there are changes to the infra (PR) or the event isn't PR
    if: |
      needs.changes.outputs.infra == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_CI }}
          role-session-name: run-${{ github.run_id }}
      - run: aws sts get-caller-identity
      - name: Get tofu version from .opentofu-version
        run: echo "tofu_version=$(cat .opentofu-version)" >> $GITHUB_OUTPUT
        id: get_tofu_version
        working-directory: tf
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.get_tofu_version.outputs.tofu_version }}
      - run: tofu init && tofu plan -out plan.tfplan
        working-directory: tf
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: tf
          path: tf/plan.tfplan

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: |
      needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: reviewdog/action-eslint@v1
        with:
          reporter: github-pr-review
          eslint_flags: "src/"
          fail_on_error: true
      - uses: EPMatt/reviewdog-action-prettier@v1
        # Want to run this regardless of the state of the previous one
        if: success() || failure()
        with:
          reporter: github-pr-review
          level: warning
          fail_on_error: true
      - run: npm run build
        if: success() || failure()
      - run: |
          echo "Some steps failed"
          exit 1;
        if: contains(join(steps.*.outcome, ','), 'failure')
      # Testing would be here, but maybe not on PR checks
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: build
          path: dist/

